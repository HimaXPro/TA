name: Keep Streamlit App Alive

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali setiap hari
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  ping-app:
    name: Ping Streamlit Web to Prevent Sleep
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Streamlit App
        run: |
          echo "Mengirim ping ke Streamlit App agar tidak pernah tidur (sleep)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 --retry 2 "https://prediksidemandhotel.streamlit.app" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" || true)
          echo "Respon status server: $STATUS_CODE"
          if [ -z "$STATUS_CODE" ]; then
            echo "✅ Ping terkirim (server mungkin sedang booting, tetap terhitung sebagai aktivitas)."
          elif [ "$STATUS_CODE" -ge 200 ] 2>/dev/null && [ "$STATUS_CODE" -lt 500 ] 2>/dev/null; then
            echo "✅ Sukses: Web aktif dan server berhasil di-refresh! (HTTP $STATUS_CODE)"
          else
            echo "✅ Ping terkirim dengan status $STATUS_CODE (tetap terhitung sebagai aktivitas di server)."
          fi
